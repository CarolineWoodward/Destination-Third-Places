<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pin finder | Destination: Third Places</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="site.css">
<style>
  .finder {
    max-width: 760px;
    margin-bottom: 26px;
  }

  .finder label {
    display: block;
    margin: 20px 0 8px;
    font-family: 'Space Mono', monospace;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: #555;
  }

  .finder .row {
    display: flex;
    gap: 10px;
  }

  .finder input[type="text"],
  .finder textarea {
    flex: 1;
    min-width: 0;
    padding: 10px 12px;
    font-family: 'Poppins', sans-serif;
    font-size: 0.95rem;
    color: #2b2b2b;
    background: #fff;
    border: 2px solid #dcd5c7;
    border-radius: 2px;
  }

  .finder textarea {
    width: 100%;
    font-family: 'Space Mono', monospace;
    font-size: 0.8rem;
    resize: none;
  }

  .finder button {
    cursor: pointer;
    padding: 10px 18px;
    font-family: 'Space Mono', monospace;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: #fff;
    background: #6b8ca8;
    border: none;
    border-radius: 2px;
    box-shadow: 0 3px 6px rgba(0, 0, 0, 0.2);
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55);
  }

  .finder button:disabled {
    opacity: 0.5;
    cursor: default;
  }

  .finder #results button.result {
    display: block;
    width: 100%;
    margin-top: 6px;
    padding: 9px 12px;
    text-align: left;
    font-family: 'Poppins', sans-serif;
    font-size: 0.85rem;
    font-weight: 400;
    letter-spacing: 0;
    text-transform: none;
    text-shadow: none;
    color: #2b2b2b;
    background: #fff;
    border: 1px solid #dcd5c7;
    box-shadow: none;
  }

  .finder #results button.result:hover {
    background: #fdf8ee;
  }

  .note {
    min-height: 1.3em;
    margin-top: 8px;
    font-size: 0.85rem;
    line-height: 1.5;
    color: #555;
  }

  .note.warn {
    color: #a3401f;
  }

  .step-hint {
    margin: 22px 0 14px;
    font-family: 'Space Mono', monospace;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: #555;
  }

  #map {
    height: 55vh;
    min-height: 380px;
  }
</style>
</head>
<body>

<a class="back-link" href="index.html">&larr; Back to all places</a>

<h1>Pin finder</h1>
<p class="subtitle">A helper for adding places. Find the place, check that the pin is in the right spot, then copy the line and paste it over the entry's opening line in index.html.</p>

<div class="finder">
  <label for="searchBox">1. Search by name or address</label>
  <div class="row">
    <input type="text" id="searchBox" placeholder="e.g. 5 Water Street, Port Jervis, NY">
    <button type="button" id="searchBtn">Search</button>
  </div>
  <div id="results"></div>

  <label for="pasteBox">Or paste a Google Maps link, or coordinates</label>
  <div class="row">
    <input type="text" id="pasteBox" placeholder="A Google Maps link from your computer's address bar, or 41.3745, -74.6930">
    <button type="button" id="pasteBtn">Use this</button>
  </div>

  <div class="note" id="note"></div>
</div>

<div class="step-hint">2. Check the pin. Click the map, or drag the pin, to fine-tune it.</div>

<div class="map-polaroid">
  <div class="tape"></div>
  <div id="map"></div>
</div>

<div class="finder">
  <label for="output">3. Copy this line over the entry's opening line</label>
  <textarea id="output" rows="2" readonly placeholder="Your line will appear here once you place a pin."></textarea>
  <div class="row" style="margin-top: 10px;">
    <button type="button" id="copyBtn" disabled>Copy line</button>
  </div>
  <div class="note" id="copyNote"></div>
  <div class="note warn" id="warn"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
  const searchBox = document.getElementById('searchBox');
  const searchBtn = document.getElementById('searchBtn');
  const results = document.getElementById('results');
  const pasteBox = document.getElementById('pasteBox');
  const pasteBtn = document.getElementById('pasteBtn');
  const noteEl = document.getElementById('note');
  const output = document.getElementById('output');
  const copyBtn = document.getElementById('copyBtn');
  const copyNote = document.getElementById('copyNote');
  const warnEl = document.getElementById('warn');

  const map = L.map('map').setView([41.4, -74.3], 10);

  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom: 19
  }).addTo(map);

  const pinIcon = L.divIcon({
    className: 'map-pin-icon',
    html: '<div class="map-pin"><div class="map-pin-head" style="background-image: radial-gradient(circle at 35% 35%, #e7b7a3, #c17b5e 55%, #8d5640 100%)"></div><div class="map-pin-needle"></div></div>',
    iconSize: [22, 34],
    iconAnchor: [11, 34]
  });

  let marker = null;

  function setNote(text, isWarning) {
    noteEl.textContent = text;
    noteEl.className = 'note' + (isWarning ? ' warn' : '');
  }

  // Places (or moves) the pin, and updates the line to copy.
  function setPin(lat, lng, zoomIn) {
    const pos = [lat, lng];
    if (!marker) {
      marker = L.marker(pos, { icon: pinIcon, draggable: true }).addTo(map);
      marker.on('dragend', function () {
        const p = marker.getLatLng();
        updateOutput(p.lat, p.lng);
      });
    } else {
      marker.setLatLng(pos);
    }
    if (zoomIn) map.setView(pos, 17);
    updateOutput(lat, lng);
  }

  function updateOutput(lat, lng) {
    output.value = '<div class="entry" onclick="openModal(this)" data-lat="' + lat.toFixed(6) + '" data-lng="' + lng.toFixed(6) + '">';
    copyBtn.disabled = false;
    copyNote.textContent = '';

    // Catch common slips: swapped numbers, a missing minus sign, a wrong town.
    const outside = lat < 41.0 || lat > 41.8 || lng < -75.0 || lng > -73.8;
    warnEl.textContent = outside
      ? 'This spot is outside Orange County, NY. Double-check the pin (a missing minus sign on the longitude is a common cause).'
      : '';
  }

  map.on('click', function (e) {
    setPin(e.latlng.lat, e.latlng.lng, false);
    setNote('Pin moved. When it is on the right spot, copy the line below.');
  });

  // ---- Search by name or address (OpenStreetMap's free search service) ----
  async function runSearch() {
    const q = searchBox.value.trim();
    if (!q) return;
    results.innerHTML = '';
    setNote('Searching...');
    try {
      const url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&countrycodes=us&viewbox=-74.8,41.7,-73.9,41.1&q=' + encodeURIComponent(q);
      const res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();

      if (data.length === 0) {
        setNote('No match found. Try the street address with the town, paste a Google Maps link, or click the map.', true);
        return;
      }

      data.forEach(function (r) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'result';
        b.textContent = r.display_name;
        b.onclick = function () {
          setPin(parseFloat(r.lat), parseFloat(r.lon), true);
          setNote('Check that the pin is on the right spot, then copy the line below.');
        };
        results.appendChild(b);
      });

      setPin(parseFloat(data[0].lat), parseFloat(data[0].lon), true);
      setNote('Showing the top match. If it looks wrong, pick another result below, or click the map to move the pin.');
    } catch (err) {
      console.error(err);
      setNote('The search service did not respond. You can still click the map or paste a Google Maps link.', true);
    }
  }

  // ---- Paste a Google Maps link or coordinates ----
  function parseLocation(text) {
    text = text.trim();
    let m;

    // A Google Maps place link: the exact pin is after !3d (latitude) and !4d (longitude).
    m = text.match(/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/);
    if (m) return { lat: parseFloat(m[1]), lng: parseFloat(m[2]), note: 'Found the exact pin in that Google Maps link. Check it, then copy the line below.' };

    // Plain coordinates, like "41.3745, -74.6930".
    m = text.match(/^\(?\s*(-?\d+(?:\.\d+)?)\s*[,\s]\s*(-?\d+(?:\.\d+)?)\s*\)?$/);
    if (m) return { lat: parseFloat(m[1]), lng: parseFloat(m[2]), note: 'Showing those coordinates. Check the pin, then copy the line below.' };

    // A link that only has the map's center (after the @), which can be far from the place.
    m = text.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/);
    if (m) return { lat: parseFloat(m[1]), lng: parseFloat(m[2]), note: 'That link only gives where the Google map was centered, which can be miles from the place. Drag the pin to the right spot before copying.', warn: true };

    return null;
  }

  function usePasted() {
    const text = pasteBox.value;
    if (!text.trim()) return;
    if (/maps\.app\.goo\.gl|goo\.gl\/maps/.test(text)) {
      setNote('Short links (maps.app.goo.gl) cannot be read. Open the place on a computer and copy the long link from the address bar, or just search by address above.', true);
      return;
    }
    const loc = parseLocation(text);
    if (!loc || isNaN(loc.lat) || isNaN(loc.lng) || Math.abs(loc.lat) > 90 || Math.abs(loc.lng) > 180) {
      setNote('Could not find coordinates in that. Paste a Google Maps link from the address bar, or numbers like 41.3745, -74.6930.', true);
      return;
    }
    setPin(loc.lat, loc.lng, true);
    setNote(loc.note, !!loc.warn);
  }

  // ---- Copy ----
  copyBtn.onclick = async function () {
    output.select();
    try {
      await navigator.clipboard.writeText(output.value);
    } catch (err) {
      document.execCommand('copy');
    }
    copyNote.textContent = 'Copied! Now paste it over the entry\'s opening <div class="entry" ...> line in index.html.';
  };

  searchBtn.onclick = runSearch;
  pasteBtn.onclick = usePasted;
  searchBox.addEventListener('keydown', function (e) { if (e.key === 'Enter') runSearch(); });
  pasteBox.addEventListener('keydown', function (e) { if (e.key === 'Enter') usePasted(); });
</script>

</body>
</html>
