<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explore the map | Destination: Third Places</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="site.css">
</head>
<body>

<a class="back-link" href="index.html">&larr; Back to all places</a>

<h1>Explore the map</h1>
<p class="subtitle">Every third place on the list so far, pinned to the map. Click a pin to open that place.</p>

<div class="filter-bar" id="filterBar">
  <span class="filter-label">Filter by:</span>
</div>

<div class="map-polaroid">
  <div class="tape"></div>
  <div id="map"></div>
</div>
<div class="map-status" id="mapStatus"></div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModalOnBackdrop(event)">
  <button class="modal-close" onclick="closeModal()">&times;</button>
  <div class="modal-box" id="modalBox">
    <div class="modal-tape"></div>
    <div class="modal-top-row">
      <div class="modal-frame" id="modalFrame"><img id="modalImg" src="" alt=""></div>
      <div class="modal-note" id="modalNote"></div>
    </div>
    <div class="modal-extras">
      <div class="modal-branch" id="modalBranch">
        <div class="branch-frames" id="branchFrames"></div>
      </div>
      <div class="modal-quote-branch" id="modalQuoteBranch">
        <div class="quote-cards" id="quoteCards"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="site.js"></script>
<script>
  // ------------------------------------------------------------------
  // How this page works
  // ------------------------------------------------------------------
  // It loads index.html, reads every .entry from it, and drops a pin for
  // each one that has data-lat / data-lng. So when you add a new entry
  // to index.html (with coordinates), it shows up here automatically.

  const MAP_DEFAULT_CENTER = [41.4, -74.3]; // Orange County, NY
  const MAP_DEFAULT_ZOOM = 10;

  let placesMap = null;
  const mapMarkers = []; // { marker, entry }

  function initMap() {
    placesMap = L.map('map', { scrollWheelZoom: false, maxZoom: 18 })
      .setView(MAP_DEFAULT_CENTER, MAP_DEFAULT_ZOOM);

    // Don't hijack page scrolling: wheel-zoom only after the map is clicked.
    placesMap.on('click', function () { placesMap.scrollWheelZoom.enable(); });
    placesMap.on('mouseout', function () { placesMap.scrollWheelZoom.disable(); });

    // OpenStreetMap's standard tiles: free and no API key needed. They
    // already include town and street names. The attribution below is
    // required by OpenStreetMap, so please leave it in.
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      maxZoom: 19
    }).addTo(placesMap);
  }

  // Reads index.html and returns its .entry elements (as plain data).
  function loadEntries() {
    return fetch('index.html', { cache: 'no-cache' })
      .then(function (res) {
        if (!res.ok) throw new Error('Could not load index.html (HTTP ' + res.status + ')');
        return res.text();
      })
      .then(function (html) {
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const entries = Array.from(doc.querySelectorAll('.entry'));
        // The main page colors entries by position; do the same here.
        entries.forEach(function (entry, i) {
          entry.dataset.accent = ACCENT_COLORS[i % ACCENT_COLORS.length];
        });
        return entries;
      });
  }

  function addPins(entries) {
    entries.forEach(function (entry) {
      const title = entry.querySelector('.entry-title').textContent.trim();
      const lat = parseFloat(entry.dataset.lat);
      const lng = parseFloat(entry.dataset.lng);
      if (isNaN(lat) || isNaN(lng)) {
        console.warn('No map coordinates yet for: ' + title);
        return;
      }

      const accent = entry.dataset.accent;
      const icon = L.divIcon({
        className: 'map-pin-icon',
        html: '<div class="map-pin"><div class="map-pin-head" style="background-image:' + pushpinGradient(accent) + '"></div><div class="map-pin-needle"></div></div>',
        iconSize: [22, 34],
        iconAnchor: [11, 34]
      });

      const marker = L.marker([lat, lng], { icon: icon, riseOnHover: true });
      marker.bindTooltip(title, { direction: 'top', offset: [0, -30], className: 'map-tooltip' });
      marker.on('click', function () { openModal(entry); });
      marker.on('add', function () {
        const el = marker.getElement();
        if (el) {
          el.setAttribute('role', 'button');
          el.setAttribute('aria-label', 'Open ' + title);
        }
      });
      marker.addTo(placesMap);
      mapMarkers.push({ marker: marker, entry: entry });
    });

    if (mapMarkers.length === 0) {
      document.getElementById('mapStatus').textContent = 'No places have map coordinates yet.';
    }
    fitMapToVisible();
  }

  function fitMapToVisible() {
    const visible = mapMarkers.filter(function (m) {
      return !m.entry.classList.contains('hidden');
    });
    if (visible.length === 0) return;
    const bounds = L.latLngBounds(visible.map(function (m) { return m.marker.getLatLng(); }));
    placesMap.fitBounds(bounds, { padding: [60, 60], maxZoom: 12 });
  }

  // Keeps pins in step with the tag filter: hidden entries lose their pin.
  function syncMapWithFilter() {
    mapMarkers.forEach(function (m) {
      const hidden = m.entry.classList.contains('hidden');
      if (hidden && placesMap.hasLayer(m.marker)) placesMap.removeLayer(m.marker);
      if (!hidden && !placesMap.hasLayer(m.marker)) m.marker.addTo(placesMap);
    });
    fitMapToVisible();
  }

  document.addEventListener('DOMContentLoaded', function () {
    const status = document.getElementById('mapStatus');

    if (typeof L === 'undefined') {
      status.textContent = "The map couldn't load. Check your connection and try again.";
      return;
    }

    initMap();

    loadEntries()
      .then(function (entries) {
        addPins(entries);
        setupFilterBar(entries, syncMapWithFilter);
      })
      .catch(function (err) {
        console.error(err);
        status.textContent = "Couldn't load the places. If you're previewing this file on your own computer, open it from the live site instead.";
      });
  });
</script>

</body>
</html>
