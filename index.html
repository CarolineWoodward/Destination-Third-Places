<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Caroline Woodward — My Project</title>
<style>
  body { font-family: Georgia, serif; background:#f7f5f2; color:#2b2b2b; max-width:900px; margin:0 auto; padding:40px 20px; }
  h1 { font-weight:400; border-bottom:2px solid #2b2b2b; padding-bottom:10px; }
  .entry { position:relative; margin:60px 0; }
  .entry img { width:100%; display:block; border:1px solid #ddd; border-radius:4px; }
  .note { background:#fff8dc; border:1px solid #e0d9b8; padding:12px 16px; border-radius:4px; box-shadow:2px 2px 6px rgba(0,0,0,0.08); font-size:0.95rem; line-height:1.4; max-width:500px; }
  .note-above { margin-bottom:12px; }
  .note-below { margin-top:12px; }
 .entry-side { display:flex; gap:20px; align-items:center; }
  .entry-side img { flex:1; margin:0; }
  .entry-side .note { flex:0 0 280px; margin:0; }
  .entry-side.reverse { flex-direction:row-reverse; }
  .entry-overlay { position:relative; }
  .entry-overlay .note { position:absolute; bottom:20px; left:20px; max-width:300px; margin:0; }
</style>
</head>
<body>

<h1>My Project</h1>
<p>A short description of what this collection documents.</p>

<!-- EXAMPLE ENTRY -->
<div class="entry">
  <div class="note note-above">Week 1 — Write your annotation for this screenshot here.</div>
  <img src="images/1. Orange County Arboretum (N).PNG" alt="Description of the screenshot">
</div>

</body>
</html>
