<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Caroline Woodward — My Project</title>
<style>
  :root { --accent:#d98c3f; }
  body { font-family: Georgia, serif; background:#f7f5f2; color:#2b2b2b; max-width:950px; margin:0 auto; padding:40px 20px; }
  h1 { font-weight:400; border-bottom:2px solid #2b2b2b; padding-bottom:10px; }

  .entry { max-width:750px; margin:50px auto; border-radius:8px; overflow:hidden; box-shadow:0 4px 14px rgba(0,0,0,0.12); background:#fff; }

  /* Fixed-size box every image sits inside, regardless of its own shape */
  .frame { width:100%; height:380px; background:var(--accent); display:flex; align-items:center; justify-content:center; }
  .frame img { max-width:100%; max-height:100%; object-fit:contain; display:block; }

  .note { background:#2b2b2b; color:#fdf6e3; padding:16px 22px; font-size:1.05rem; line-height:1.5; border-left:6px solid var(--accent); }
  .note-above, .note-below { border-left:none; border-top:6px solid var(--accent); }

  .entry-side { display:flex; align-items:stretch; }
  .entry-side .frame { flex:1 1 0; min-width:0; height:380px; }
  .entry-side .note { flex:0 0 240px; display:flex; align-items:center; border-top:none; border-left:6px solid var(--accent); }
  .entry-side.reverse { flex-direction:row-reverse; }
  .entry-side.reverse .note { border-left:none; border-right:6px solid var(--accent); }

  .entry-overlay { position:relative; }
  .entry-overlay .note { position:absolute; bottom:0; left:0; right:0; border-left:none; border-top:6px solid var(--accent); }
</style>
</head>
<body>

<h1>My Project</h1>
<p>A short description of what this collection documents.</p>

<!-- ENTRY 1 — annotation ABOVE -->
<div class="entry">
  <div class="note note-above">Annotation text for image 1.</div>
  <div class="frame"><img src="images/yourfile1.png" alt="Description"></div>
</div>

<!-- ENTRY 2 — annotation BELOW -->
<div class="entry">
  <div class="frame"><img src="images/yourfile2.png" alt="Description"></div>
  <div class="note note-below">Annotation text for image 2.</div>
</div>

<!-- ENTRY 3 — annotation BESIDE -->
<div class="entry entry-side">
  <div class="frame"><img src="images/yourfile3.png" alt="Description"></div>
  <div class="note">Annotation text for image 3.</div>
</div>

<!-- ENTRY 4 — annotation OVERLAID -->
<div class="entry entry-overlay">
  <div class="frame"><img src="images/yourfile4.png" alt="Description"></div>
  <div class="note">Annotation text for image 4.</div>
</div>

</body>
</html>
