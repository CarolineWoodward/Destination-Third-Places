<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Caroline Woodward — My Project</title>
<style>
  body { font-family: Georgia, serif; background:#f7f5f2; color:#2b2b2b; max-width:900px; margin:0 auto; padding:40px 20px; }
  h1 { font-weight:400; border-bottom:2px solid #2b2b2b; padding-bottom:10px; }

  .entry { max-width:500px; margin:50px auto; border-radius:8px; overflow:hidden; box-shadow:0 4px 14px rgba(0,0,0,0.12); background:#fff; }
  .entry img { width:100%; display:block; }

  .note { background:#2b2b2b; color:#fdf6e3; padding:16px 22px; font-size:1.05rem; line-height:1.5; border-left:6px solid #d98c3f; }

  .entry-side { display:flex; align-items:stretch; }
  .entry-side img { flex:1; width:auto; object-fit:cover; }
  .entry-side .note { flex:0 0 220px; display:flex; align-items:center; border-left:none; border-top:6px solid #d98c3f; }
  .entry-side.reverse { flex-direction:row-reverse; }
  .entry-side.reverse .note { border-left:6px solid #d98c3f; border-top:none; }

  .entry-overlay { position:relative; }
  .entry-overlay .note { position:absolute; bottom:0; left:0; right:0; max-width:none; border-left:none; border-top:6px solid #d98c3f; }
</style>
</head>
<body>

<h1>My Project</h1>
<p>A short description of what this collection documents.</p>

<!-- Annotation BESIDE the image (add class="entry-side reverse" to flip sides) -->
<div class="entry entry-side">
  <img src="images/1. Orange County Arboretum.PNG" alt="Description">
  <div class="note">Montgomery, NY — A park where people can gather and admire plants. People can bring food and borrow picnic tables.</div>
</div>

</body>
</html>
